[project]
name = "cjdb"
version = "2.2.0"
description = "CJDB is a tool that enables CityJSON integration with a PostgreSQL database"
authors = [
    { name = "Cynthia Cai" },
    { name = "Lan Yan" },
    { name = "Yitong Xia" },
    { name = "Chris Poon" },
    { name = "Siebren Meines" },
    { name = "Leon Powalka" },
]
maintainers = [
    { name = "Gina Stavropoulou", email = "g.stavropoulou@tudelft.nl" },
    { name = "Hugo Ledoux", email = "h.ledoux@tudelft.nl" },
]
license = "MIT"
readme = "README.md"
keywords = ["CityJSON", "PostgreSQL"]
requires-python = ">=3.10"
dependencies = [
    "shapely>=2.0.1,<3.0.0",
    "numpy>=1.24.2,<2.0.0",
    "pyproj>=3.5.0,<4.0.0",
    "requests>=2.28.2,<3.0.0",
    "psycopg2-binary>=2.9.6,<3.0.0",
    "geoalchemy2>=0.13.1,<0.14.0",
    "cjio>=0.9,<0.10.0",
]

[project.scripts]
cjdb = "cjdb.cli:cjdb"

[dependency-groups]
dev = [
    "mypy>=1.1.1,<2.0.0",
    "ruff>=0.16.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "pytest-postgresql>=8.1.0,<9.0.0",
    "psycopg>=3.1.8,<4.0.0",
    "furo>=2023.7.26,<2024.0.0",
    "sphinx-click>=4.4.0,<5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
